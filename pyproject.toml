[project]
name = "knowledge-graphs-lab"
version = "0.1.0"
description = "A research-grade knowledge graph laboratory for academic AI and graph analytics experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Hira Khyzer" }
]
license = { text = "MIT" }
dependencies = [
  "networkx>=3.2,<4.0",
  "pandas>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
